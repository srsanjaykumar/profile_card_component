<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Profile card component</title>


  
</head>
<body>

  <div class="card">
    <div class="card__image">
      <img class="bg-pattern" src="./images/bg-pattern-card.svg" alt="" srcset="">
      <img class="avatar" src="./images/image-victor.jpg" alt="Victor Crest" srcset="">
    </div>
    <div class="card__content">
      <div class="content--name"><h2 class="name">Victor Crest</h2><span >26</span></div>
  
      <p class="location">London</p>
      <hr>
      <div class="content--socials">
        <div class="followers"><h2>80K</h2> <p>Followers</p></div>
        <div class="likes"><h2>803K</h2> <p>Likes</p></div>
        <div class="photos"><h2>1.4K</h2> <p>Photos</p></div>
      </div>
    </div>
 
  </div>
</body>
</html>
